name: Zone guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  zones:
    # A develop -> main release PR aggregates changes from all zones.
    if: github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zone boundary regression tests
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py'
      - name: Enforce owned path zones
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOW_CROSS_ZONE: ${{ contains(github.event.pull_request.labels.*.name, 'cross-zone-approved') }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed.txt
          if [ "$ALLOW_CROSS_ZONE" = "true" ]; then
            python .github/scripts/zone_guard.py changed.txt --allow-cross-zone
          else
            python .github/scripts/zone_guard.py changed.txt
          fi