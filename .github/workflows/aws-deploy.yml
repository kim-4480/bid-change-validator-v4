name: AWS dev build and deploy

# Manual-only AWS build/deploy gate. Automatic ECR/S3 writes on develop push are forbidden.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested images to EC2 after building them
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: aws-dev-${{ github.event_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  REGISTRY: 226234259348.dkr.ecr.ap-northeast-2.amazonaws.com
  INSTANCE_ID: i-080c0feecbcfb9826
  BUCKET: bidcheck-dev-docs-226234259348-apne2
  SITE_ORIGIN: https://15-165-249-43.sslip.io

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::226234259348:role/bidcheck-dev-github-deploy-role
          aws-region: ap-northeast-2
      - name: Wait for successful develop CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh run list --workflow ci.yml --branch develop --commit "$GITHUB_SHA" --event push --limit 5 \
              --json status,conclusion \
              --jq 'if length == 0 then "not_found" else .[0].status + ":" + (.[0].conclusion // "") end')
            case "$state" in
              completed:success) echo "CI passed for $GITHUB_SHA"; exit 0 ;;
              completed:*) echo "CI not successful: $state"; exit 1 ;;
              *) echo "Waiting for CI: $state"; sleep 15 ;;
            esac
          done
          echo "CI timeout after 15 minutes" >&2
          exit 1
      - name: Login to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Build and publish immutable API image
        run: |
          if ! aws ecr describe-images --repository-name bidcheck-v4-api --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            docker build -f apps/api/Dockerfile -t "$REGISTRY/bidcheck-v4-api:$GITHUB_SHA" .
            docker push "$REGISTRY/bidcheck-v4-api:$GITHUB_SHA"
          fi
      - name: Build and publish immutable Web image
        run: |
          if ! aws ecr describe-images --repository-name bidcheck-v4-web --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            docker build -f apps/web/Dockerfile.aws --build-arg NEXT_PUBLIC_API_BASE_URL="$SITE_ORIGIN" \
              -t "$REGISTRY/bidcheck-v4-web:$GITHUB_SHA" .
            docker push "$REGISTRY/bidcheck-v4-web:$GITHUB_SHA"
          fi
      - name: Publish small runtime bundle
        run: |
          tar -czf runtime.tar.gz -C deploy/aws \
            docker-compose.yml Caddyfile prepare-env.py deploy.sh install-runtime.sh smoke_storage.py
          aws s3 cp runtime.tar.gz "s3://$BUCKET/deploy/runtime-$GITHUB_SHA.tar.gz" --only-show-errors

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::226234259348:role/bidcheck-dev-github-deploy-role
          aws-region: ap-northeast-2
      - name: Deploy through SSM without SSH or GitHub-hosted secrets
        run: |
          COMMANDS=$(jq -nc --arg bucket "$BUCKET" --arg sha "$GITHUB_SHA" '{commands:[
            "set -eu",
            "install -d -m 0700 /opt/bidcheck",
            ("aws s3 cp s3://"+$bucket+"/deploy/runtime-"+$sha+".tar.gz /opt/bidcheck/runtime.tar.gz --region ap-northeast-2 --only-show-errors"),
            "tar -xzf /opt/bidcheck/runtime.tar.gz -C /opt/bidcheck",
            ("bash /opt/bidcheck/deploy.sh "+$sha)
          ]}')
          ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters "$COMMANDS" \
            --query 'Command.CommandId' --output text)
          if ! aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
              --query '[Status,ResponseCode,StandardOutputContent,StandardErrorContent]' --output json || true
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,ResponseCode,StandardOutputContent,StandardErrorContent]' --output json

